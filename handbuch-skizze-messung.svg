<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 760" role="img" aria-label="Zwei Wege, Licht im Nebel zu messen" font-family="Inter, sans-serif">
  <text x="240" y="22" text-anchor="middle" font-size="19" font-weight="600" fill="#1b1b1b">Zwei Wege, Licht im Nebel zu messen</text>
  <!-- Objektmessung -->
  <rect x="6" y="44" width="468" height="348" rx="12" fill="#fff" stroke="#555" stroke-width="1.6"/>
  <text x="240" y="82" text-anchor="middle" font-size="16" font-weight="600" fill="#1b1b1b">Objektmessung (direkt)</text>
  <rect x="390" y="116" width="66" height="180" rx="9" fill="#e6e6e6"/>
  <rect x="418" y="140" width="10" height="134" fill="#555"/>
  <text x="423" y="324" text-anchor="middle" font-size="15" fill="#1b1b1b">Motiv</text>
  <rect x="40" y="186" width="88" height="54" rx="10" fill="#fff" stroke="#444" stroke-width="1.6"/>
  <text x="84" y="219" text-anchor="middle" font-size="15" fill="#1b1b1b">Kamera</text>
  <line x1="128" y1="213" x2="368" y2="213" stroke="#444" stroke-width="1.4"/>
  <path d="M376 213 l-10 -5 v10 z" fill="#444"/>
  <text x="250" y="198" text-anchor="middle" font-size="13" fill="#666">Zelle zeigt aufs Motiv</text>
  <text x="24" y="352" font-size="13" fill="#1b1b1b">Leicht nach unten, wenig Himmel</text>
  <text x="24" y="376" font-size="13" font-weight="600" fill="#1b1b1b">Dann +1: ISO 400 auf 200</text>
  <!-- Lichtmessung -->
  <rect x="6" y="410" width="468" height="344" rx="12" fill="#f2f2f2" stroke="#555" stroke-width="2.2"/>
  <text x="240" y="448" text-anchor="middle" font-size="16" font-weight="600" fill="#1b1b1b">Lichtmessung (Kalotte)</text>
  <rect x="390" y="482" width="66" height="180" rx="9" fill="#e2e2e2"/>
  <rect x="418" y="506" width="10" height="134" fill="#555"/>
  <text x="423" y="690" text-anchor="middle" font-size="15" fill="#1b1b1b">Motiv</text>
  <path d="M368 566 a14 14 0 0 0 0 30 z" fill="#ccc" stroke="#444" stroke-width="1.4"/>
  <rect x="40" y="554" width="88" height="54" rx="10" fill="#fff" stroke="#444" stroke-width="1.6"/>
  <text x="84" y="587" text-anchor="middle" font-size="15" fill="#1b1b1b">Kamera</text>
  <line x1="140" y1="581" x2="366" y2="581" stroke="#444" stroke-width="1.4"/>
  <path d="M132 581 l10 -5 v10 z" fill="#444"/>
  <text x="252" y="566" text-anchor="middle" font-size="13" fill="#666">Kalotte zeigt zur Kamera</text>
  <text x="24" y="716" font-size="13" fill="#1b1b1b">Im Nebel auch vom Standort aus</text>
  <text x="24" y="740" font-size="13" font-weight="600" fill="#1b1b1b">Keine Korrektur, ISO 400 lassen</text>
</svg>
